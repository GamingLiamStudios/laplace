[package]
name = "Laplace"
version = "0.1.0"
edition = "2021"
authors = [
    "GamingLiamStudios <58615717+GamingLiamStudios@users.noreply.github.com>",
]

[dependencies]
tracing = "0.1"

bytemuck = "1.21"
image = "0.25"
thiserror = "2.0"

# The biggest fucking library known to man
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "6.0"

# ...But i think this is bigger
bevy = { version = "0.15", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_color",
    "bevy_render",
    "bevy_pbr",
    "bevy_mesh_picking_backend",
    "bevy_state",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "bevy_scene",
    "multi_threaded",
    "x11",
    "wayland",
    "dynamic_linking",
    "file_watcher",
] }
bevy_egui = "0.32"

step = { git = "https://github.com/Formlabs/foxtrot.git" }
triangulate = { git = "https://github.com/Formlabs/foxtrot.git" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
perf = "deny"
all = "deny"
